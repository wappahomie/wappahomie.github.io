---
layout: default
title: 活動報告一覧 | わっぱ
---
<section>
    <h2>活動報告一覧</h2>
    <p style="text-align: center; margin-bottom: 30px;">これまでの活動の記録です。</p>
    <div class="card-container">
        <!-- 全ての記事を表示する仕組み -->
        {% for post in site.posts %}
        <div class="card">
            {% if post.thumbnail %}
            <img src="{{ post.thumbnail | relative_url }}" alt="{{ post.title }}" style="width:100%; height: 200px; object-fit: cover; border-radius: 8px; margin-bottom: 10px;">
            {% endif %}
            <h3 style="border-bottom: none;"><a href="{{ post.url | relative_url }}" style="color: var(--primary-color); text-decoration: none;">{{ post.title }}</a></h3>
            <p style="font-size: 0.9em; color: #666;">{{ post.date | date: "%Y年%m月%d日" }}</p>
        </div>
        {% endfor %}
    </div>
</section>
